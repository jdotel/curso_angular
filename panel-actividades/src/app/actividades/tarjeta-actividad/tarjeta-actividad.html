<article class="tarjeta" [class.tarjeta--seleccionada]="seleccionada()">
  <h3 class="tarjeta__encabezado">
    <button
      type="button"
      class="tarjeta__titulo"
      [attr.aria-pressed]="seleccionada()"
      (click)="seleccionCambiada.emit(actividad().id)">
      {{ actividad().titulo }}
    </button>
  </h3>

  <p class="tarjeta__estado">
    <span class="tarjeta__punto" aria-hidden="true"></span>
    {{ etiquetaEstado() }}
  </p>

  <div class="tarjeta__acciones">
    <button
      type="button"
      [attr.aria-label]="etiquetaAvanzar()"
      [disabled]="actividad().estado === 'completada'"
      (click)="avanceSolicitado.emit(actividad().id)">
      Completar
    </button>

    <button
      type="button"
      [attr.aria-label]="etiquetaEliminar()"
      (click)="eliminacionSolicitada.emit(actividad().id)">
      Eliminar
    </button>
  </div>
</article>
