<label for="buscar">Buscar por título</label>
<input id="buscar" type="search" [value]="termino()" (input)="escribirTermino($event)">

<label for="estado">Estado</label>
<select id="estado" [value]="estado()" (change)="elegirEstado($event)">
  <option value="todas">Todos</option>
  <option value="pendiente">Pendiente</option>
  <option value="en_progreso">En progreso</option>
  <option value="completada">Completada</option>
</select>

<label for="prioridad">Prioridad</label>
<select id="prioridad" [value]="prioridad()" (change)="elegirPrioridad($event)">
  <option value="todas">Todas</option>
  <option value="baja">Baja</option>
  <option value="media">Media</option>
  <option value="alta">Alta</option>
</select>

<button type="button" (click)="limpiar()">Limpiar filtros</button>
